<!DOCTYPE html>
<html style="height: 100%; margin: 0; padding: 0">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--
        NOTE: Placeholder strings. Either do not change or change the lookup
        code too.
    -->
    <title>Magic App</title>
    <meta property="og:description" content="Web app made with Magic.jl">

    <link rel="icon" type="image/png" href="/Magic.jl/images/favicon.ico">

    <style>
        .mg-theme-light {
            --mg-link-color: #002fbd;
        }

        .mg-theme-dark {
            --mg-link-color: #577ae3;
            --mg-page-background-color: #0e1117;
            --mg-page-color: #fafafa;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --mg-link-color: #002fbd;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --mg-link-color: #577ae3;
                --mg-page-background-color: #0e1117;
                --mg-page-color: #fafafa;
            }
        }

        body {
            background: var(--mg-page-background-color, initial);
            color: var(--mg-page-color, initial);
        }

        h1, h2 {
            margin: 0;
        }

        a, a:hover, a:visited {
            text-decoration: none;
            color: var(--mg-link-color, inherit);
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="BODY_CLASS" style="height: 100%; font-family: sans-serif; margin: 0; padding: 0;">
    <div style="display: flex; height: 100%; justify-content: center; align-items: center;">

        </div>
    </div>
</body>
</html>
